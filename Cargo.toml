[workspace]
members = ["crates/escrow", "crates/resolver", "crates/payout"]
resolver = "2"

[workspace.package]
edition = "2021"
version = "0.1.0"
authors = ["Wagr Protocol Contributors"]
license = "MIT"

[workspace.dependencies]
soroban-sdk = "29.0.1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
overflow-checks = true
debug-assertions = false
panic = "abort"
strip = "symbols"
